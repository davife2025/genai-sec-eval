[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secbench"
version = "0.1.0"
description = "A small, reproducible security evaluation harness for LLM apps, using Hugging Face Inference Providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["huggingface_hub>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
langchain = ["langchain-huggingface", "langchain-core"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["secbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
